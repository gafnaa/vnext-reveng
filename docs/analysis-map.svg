  <text x="346" y="838" class="body">F-01–F-06</text>
  <text x="346" y="856" class="small">static deep dive + staging plan</text>
  <text x="612" y="846" class="body">static analysis</text>
  <text x="808" y="838" class="body">6 findings · 3 staging plans</text>
  <text x="808" y="856" class="small">belum ada request/response</text>
  <rect x="1098" y="826" width="88" height="22" rx="11" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="1158" y="841" text-anchor="middle" class="pill" fill="#be123c">KANDIDAT</text>
  <text x="1098" y="868" class="tiny">validasi server/staging belum dilakukan</text>

  <line x1="64" y1="910" x2="1376" y2="910" class="divider"/>
  <text x="64" y="936" class="small">Status per 2026-10-27. “Selesai” berarti unit dalam inventaris sudah diproses, bukan source Dart asli pulih identik.</text>
  <text x="64" y="954" class="small">Runtime tetap 0 sesi dan 0 request backend. Temuan keamanan tetap kandidat sampai diuji di staging berizin dengan akun sintetis.</text>
  <text x="64" y="978" class="tiny">Sumber: PROGRESS.md, artifact-manifest.json, DEX-DECOMPILATION.md, GHIDRA-APP-DECOMPILE.md, FEATURE-MAP.md, SECURITY-FINDINGS.md.</text>
