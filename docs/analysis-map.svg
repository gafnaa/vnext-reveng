  <text x="808" y="324" class="small">50 komponen terinventaris</text>
  <rect x="1098" y="294" width="96" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1162" y="309" text-anchor="middle" class="pill" fill="#1d4ed8">DIPERIKSA</text>
  <text x="1098" y="336" class="tiny">bukan observasi runtime</text>

