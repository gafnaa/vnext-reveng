<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Peta cakupan analisis Simaster UGM Student vNEXT</title>
  <desc id="desc">Matriks visual per lapisan analisis: sumber dan denominator, alat, keluaran, serta status cakupan. Status dibedakan menjadi selesai, tercatat, parsial, dan kandidat. Angka per 27 Oktober 2026.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #64748b; }
      .title { font-size: 31px; font-weight: 750; letter-spacing: -0.6px; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .header { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: #cbd5e1; }
      .layer { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; fill: #334155; }
      .small { font-size: 10px; fill: #64748b; }
      .tiny { font-size: 9px; fill: #64748b; }
      .num { font-size: 10px; font-weight: 700; fill: #94a3b8; }
      .pill { font-size: 9px; font-weight: 800; letter-spacing: 0.7px; }
      .legend { font-size: 10px; fill: #475569; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#f6f8fb"/>
  <circle cx="1364" cy="50" r="160" fill="#e8f1fb" opacity="0.55"/>
  <circle cx="80" cy="952" r="180" fill="#ecfdf5" opacity="0.55"/>

  <text x="64" y="48" class="eyebrow">PROGRESS MAP / 2026-10-27</text>
  <text x="64" y="84" class="title">Peta cakupan analisis</text>
  <text x="64" y="108" class="subtitle">Setiap lapisan: sumber → alat → keluaran → status. Angka adalah unit dalam inventaris beku, bukan pemulihan source asli.</text>

  <g transform="translate(944,38)">
    <rect x="0" y="0" width="432" height="58" rx="12" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
    <circle cx="20" cy="22" r="5" fill="#059669"/>
    <text x="32" y="26" class="legend">Selesai</text>
    <circle cx="106" cy="22" r="5" fill="#2563eb"/>
    <text x="118" y="26" class="legend">Tercatat</text>
    <circle cx="206" cy="22" r="5" fill="#d97706"/>
    <text x="218" y="26" class="legend">Parsial</text>
    <circle cx="300" cy="22" r="5" fill="#e11d48"/>
    <text x="312" y="26" class="legend">Kandidat</text>
    <text x="20" y="45" class="tiny">Status operasional per snapshot; bukan skor keseluruhan.</text>
  </g>

  <line x1="64" y1="128" x2="1376" y2="128" class="divider"/>

  <!-- table header -->
  <rect x="64" y="148" width="1312" height="48" rx="10" fill="#0f172a"/>
  <text x="80" y="177" class="header">LAPISAN</text>
  <text x="346" y="177" class="header">SUMBER / DENOMINATOR</text>
  <text x="612" y="177" class="header">ALAT</text>
  <text x="808" y="177" class="header">KELUARAN</text>
  <text x="1098" y="177" class="header">STATUS</text>

  <!-- row 01 -->
  <rect x="64" y="202" width="1312" height="76" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="64" y="202" width="4" height="76" fill="#059669"/>
  <text x="80" y="226" class="num">01</text>
  <text x="80" y="246" class="layer">Kontainer</text>
  <text x="80" y="264" class="small">XAPK/split inventory</text>
  <text x="346" y="230" class="body">XAPK · 20 entri</text>
  <text x="346" y="248" class="small">base + config + native split</text>
  <text x="612" y="238" class="body">inventory / unzip</text>
  <text x="808" y="230" class="body">20/20 entri APK/split</text>
