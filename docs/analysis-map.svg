  <text x="808" y="476" class="small">fallback tidak menulis resource</text>
  <rect x="1098" y="446" width="82" height="22" rx="11" fill="#fffbeb" stroke="#fde68a"/>
  <text x="1155" y="461" text-anchor="middle" class="pill" fill="#92400e">PARSIAL</text>
  <text x="1098" y="488" class="tiny">rekonsiliasi sumber belum selesai</text>

  <!-- row 05 -->
  <rect x="64" y="506" width="1312" height="76" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="64" y="506" width="4" height="76" fill="#d97706"/>
  <text x="80" y="530" class="num">05</text>
  <text x="80" y="550" class="layer">Dart AOT / Blutter</text>
  <text x="80" y="568" class="small">libapp.so</text>
  <text x="346" y="534" class="body">29.989 header function</text>
  <text x="346" y="552" class="small">418 file paket aplikasi</text>
  <text x="612" y="542" class="body">Blutter</text>
  <text x="808" y="534" class="body">2.312 file assembly</text>
  <text x="808" y="552" class="small">2.796 header aplikasi</text>
  <rect x="1098" y="522" width="82" height="22" rx="11" fill="#fffbeb" stroke="#fde68a"/>
  <text x="1155" y="537" text-anchor="middle" class="pill" fill="#92400e">PARSIAL</text>
  <text x="1098" y="564" class="tiny">1 assertion · denominator range pending</text>

  <!-- row 06 -->
  <rect x="64" y="582" width="1312" height="76" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="64" y="582" width="4" height="76" fill="#059669"/>
  <text x="80" y="606" class="num">06</text>
  <text x="80" y="626" class="layer">Ghidra app-level</text>
  <text x="80" y="644" class="small">paket simaster_ugm</text>
  <text x="346" y="610" class="body">2.796 function start</text>
  <text x="346" y="628" class="small">33 existing + 2.763 baru</text>
  <text x="612" y="618" class="body">Ghidra 12.1.4</text>
  <text x="808" y="610" class="body">2.763 pseudocode baru</text>
  <text x="808" y="628" class="small">0 gagal · 0 caveat baru</text>
  <rect x="1098" y="598" width="86" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="1157" y="613" text-anchor="middle" class="pill" fill="#047857">SELESAI</text>
  <text x="1098" y="640" class="tiny">2.796/2.796 start aplikasi terwakili</text>
  <rect x="1098" y="648" width="230" height="4" rx="2" fill="#d1fae5"/>
  <rect x="1098" y="648" width="230" height="4" rx="2" fill="#059669"/>

  <!-- row 07 -->
  <rect x="64" y="658" width="1312" height="76" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="64" y="658" width="4" height="76" fill="#d97706"/>
  <text x="80" y="682" class="num">07</text>
  <text x="80" y="702" class="layer">Ghidra full binary</text>
  <text x="80" y="720" class="small">seluruh libapp.so</text>
  <text x="346" y="686" class="body">29.989 header · 12,78 MB .text</text>
  <text x="346" y="704" class="small">function + code range</text>
  <text x="612" y="694" class="body">Ghidra 12.1.4</text>
  <text x="808" y="686" class="body">4.815 functions</text>
  <text x="808" y="704" class="small">3.862 matched · 953 Ghidra-only</text>
  <rect x="1098" y="674" width="82" height="22" rx="11" fill="#fffbeb" stroke="#fde68a"/>
  <text x="1155" y="689" text-anchor="middle" class="pill" fill="#92400e">PARSIAL</text>
  <text x="1098" y="716" class="tiny">12,88% · 50 jump table · VM snapshot 92.768 B</text>
  <rect x="1098" y="724" width="230" height="4" rx="2" fill="#fef3c7"/>
  <rect x="1098" y="724" width="30" height="4" rx="2" fill="#d97706"/>

  <!-- row 08 -->
  <rect x="64" y="734" width="1312" height="76" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="64" y="734" width="4" height="76" fill="#2563eb"/>
  <text x="80" y="758" class="num">08</text>
  <text x="80" y="778" class="layer">Feature map</text>
  <text x="80" y="796" class="small">modul, route, service</text>
  <text x="346" y="762" class="body">43 modul · 49 route</text>
  <text x="346" y="780" class="small">36 caller/service triples</text>
  <text x="612" y="770" class="body">static extraction</text>
  <text x="808" y="762" class="body">route dan service map</text>
  <text x="808" y="780" class="small">29 label service unik</text>
  <rect x="1098" y="750" width="90" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1159" y="765" text-anchor="middle" class="pill" fill="#1d4ed8">TERCATAT</text>
  <text x="1098" y="792" class="tiny">belum diuji runtime · binding /oss_v2 pending</text>

  <!-- row 09 -->
  <rect x="64" y="810" width="1312" height="76" fill="#ffffff" stroke="#e2e8f0"/>
