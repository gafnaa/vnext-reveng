name: Documentation CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs and sanitized source tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate docs, manifests, links, and sensitive patterns
        run: python3 scripts/validate_repo.py
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  publish-report-bundle:
    name: Package sanitized report bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Build allowlisted documentation bundle
        run: python3 scripts/package_reports.py dist/simaster-static-reports.zip
      - name: Upload private workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simaster-static-reports-${{ github.sha }}
          path: |
            dist/simaster-static-reports.zip
            dist/simaster-static-reports.zip.sha256
          if-no-files-found: error
          retention-days: 30
